<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadrilha Junina 2026</title>
    
    <link rel="stylesheet" href="css/style.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>

    <div class="bandeirinhas"></div>

    <header>
        <div class="logos"></div>
        <h1>Arraiá da Juventude</h1>
        <h2>Paróquia Nossa Senhora de Fátima</h2>
    </header>

    <div class="container">

        <div class="card">
            <h2>Inscrição da Quadrilha</h2>
            
            <form id="formInscricao">
                
                <label>Nome da Dupla</label>
                <input id="dupla" placeholder="Ex: João e Maria" required>

                <input type="hidden" id="participante1" value="-">
                <input type="hidden" id="participante2" value="-">

                <label>Telefone</label>
                <input id="telefone" placeholder="(00) 00000-0000" required>

                <label>Confirma Presença?</label>
                <select id="presenca">
                    <option>Sim</option>
                    <option>Não</option>
                </select>

                <button type="submit">Confirmar Inscrição</button>
            </form>
        </div>

        <div class="card">
            <h3>Faltam apenas:</h3>
            <div id="contador">
                <div><span id="dias">0</span> Dias</div>
                <div><span id="horas">0</span> Horas</div>
                <div><span id="minutos">0</span> Min</div>
                <div><span id="segundos">0</span> Seg</div>
            </div>

            <h3 style="margin-top: 20px;">Ensaios</h3>
            <div class="ensaios">
                <ul>
                    <li>📅 20/06 - 15h30</li>
                    <li>📅 27/06 - 15h30</li>
                    <li>📅 04/07 - 15h30</li>
                </ul>
            </div>

            <div class="apresentacao">
                🎉 Apresentação: 11/07
            </div>
        </div>

    </div>

    <script src="js/app.js"></script>

</body>
</html>
