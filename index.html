<head>

<title>Quadrilha Junina 2026</title>

<style>

body{
margin:0;
font-family:'Trebuchet MS',sans-serif;
background:#FFF5D6;
background-image:
radial-gradient(circle,#ffe08a 1px,transparent 1px);

header{
background:#D35400;

padding:25px;
}

header h1{
margin:0;
}

.container{
max-width:800px;
margin:30px auto;
padding:20px;
}

.card{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,.15);
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,select{
width:100%;
padding:12px;
margin-top:5px;
border-radius:10px;
border:1px solid #ccc;
}

button{
margin-top:25px;
width:100%;
padding:15px;
font-size:18px;
border:none;
border-radius:10px;
background:#E67E22;
color:white;
cursor:pointer;
}

button:hover{
background:#CA6F1E;
}

#sucesso{
display:none;
text-align:center;
}

.data{
background:#FFF3CD;
padding:15px;
margin:10px 0;
border-radius:10px;
font-size:18px;
}

.loading{
display:none;
text-align:center;
margin-top:20px;
}

</style>

</head>

<body>

<header>
<h1>🎉 Arraiá Jovens de Fátima 🎉</h1>
<p>Paróquia Nossa Senhora de Fátima</p>
</header>

<div class="container">

<div class="card" id="formulario">

<h2>Inscrição da Quadrilha</h2>

<label>Participante 1</label>
<input id="p1">

<label>Participante 2</label>
<input id="p2">

<label>Telefone</label>
<input id="telefone">

<label>Confirma Presença?</label>

<select id="presenca">
<option>Sim</option>
<option>Não</option>
</select>

<button onclick="enviar()">
Confirmar Inscrição
</button>

<div class="loading" id="loading">
⏳ Enviando inscrição...
</div>

</div>

<div class="card" id="sucesso">

<h1>🎊 Inscrição Confirmada!</h1>

<p>
Sua dupla foi cadastrada com sucesso.
</p>

<h2>Ensaios</h2>

<div class="data">📅 20/06</div>
<div class="data">📅 27/06</div>
<div class="data">📅 04/07</div>

<h2>Apresentação</h2>

<div class="data">🎉 11/07</div>

<p>
Esperamos vocês! 🌽🔥🤠
</p>

</div>

</div>

<script>

const URL_SCRIPT = "COLE_AQUI_SUA_URL";

async function enviar(){

const dados = {
dupla: document.getElementById('dupla').value,
participante1: document.getElementById('p1').value,
participante2: document.getElementById('p2').value,
telefone: document.getElementById('telefone').value,
presenca: document.getElementById('presenca').value
};

if(!dados.dupla){
alert("Informe o nome da dupla");
return;
}

document.getElementById("loading").style.display="block";

try{

await fetch(URL_SCRIPT,{
method:"POST",
body:JSON.stringify(dados)
});

document.getElementById("formulario").style.display="none";
document.getElementById("sucesso").style.display="block";

}catch(e){

alert("Erro ao enviar inscrição.");

}

}

</script>

</body>
</html>
